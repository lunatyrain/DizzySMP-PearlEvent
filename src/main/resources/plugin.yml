name: DizzySMP-PearlEvent
version: 1.0.0
main: dev.dizzysmp.pearlevent.PearlEventPlugin
api-version: "26.2"
depend: [DizzySMP]
description: Addon for DizzySMP - timed Infinite Pearl firework drop event.
commands:
  infpearlevent:
    description: Control the Infinite Pearl event (op only)
    usage: /infpearlevent <setpos|settimer|start|stop|status>
    aliases: [pearlevent]
    permission: infpearlevent.admin
permissions:
  infpearlevent.admin:
    default: op
